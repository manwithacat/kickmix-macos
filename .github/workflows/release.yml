name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       build: "cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64" }
          - { os: macos-15-intel, build: "cp312-macosx_x86_64 cp313-macosx_x86_64" }
          - { os: ubuntu-24.04,   build: "cp312-manylinux_x86_64 cp313-manylinux_x86_64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pybind11==2.12.0" cibuildwheel~=3.3 setuptools wheel
      - run: python -m cibuildwheel kickmix --output-dir dist
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: python {project}/tests/smoke_neon_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install setuptools "pybind11==2.12.0" wheel
      - run: cd kickmix && python setup.py sdist && mv dist ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && shasum -a 256 dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Prebuilt `kickmix` wheels from this repository's vendored upstream commit plus the
            NEON overlay (see CHANGES.md). Install with
            `pip install <wheel>` and `pip install numpy scipy` for the competition verifiers.
            Apple Silicon wheels include the NEON word types; Intel and Linux wheels use the
            upstream SSE/AVX paths. SHA256SUMS lists every file.
